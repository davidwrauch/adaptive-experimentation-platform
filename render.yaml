services:
  - type: web
    name: adaptive-experimentation-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-experimentation-db
          property: connectionString

databases:
  - name: adaptive-experimentation-db
    databaseName: adaptive
    user: adaptive
